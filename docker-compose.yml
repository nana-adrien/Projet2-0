# Lance le serveur Spring Boot en conteneur, connecté au Supabase CLI local
# (`supabase start`, voir supabase/config.toml) via host.docker.internal.
#
# Build du jar avant de lancer : ./gradlew :server:app:bootJar
# Puis : docker compose up --build
services:
  api:
    build:
      context: ./server/app
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SUPABASE_DB_URL: jdbc:postgresql://host.docker.internal:54332/postgres
      SUPABASE_DB_USER: postgres
      SUPABASE_DB_PASSWORD: postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
