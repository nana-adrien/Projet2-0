# Profil "local" : connexion au Supabase CLI lancé avec `supabase start` à la racine du projet.
# Activer avec SPRING_PROFILES_ACTIVE=local (ou -Dspring.profiles.active=local).
# Port de la base décalé à 54332 (au lieu du 54322 par défaut) : un autre projet Supabase local
# tournait déjà sur les ports par défaut sur cette machine (voir supabase/config.toml).

spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:54332/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    # Configuration pour envoyer les mails de Spring vers le Mailpit de Supabase local
    host: localhost
    port: 1025
    # Propriétés de protocole standard
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  devtools:
    restart:
      enabled: false

server:
  port: 8085

app:
  jwt:
    secret: dGhpcy1pcy1hLXNlY3JldC1rZXktZm9yLWRldmVsb3BtZW50LW9ubHk=
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000
  frontend-url: http://localhost:8085/swagger-ui.html

