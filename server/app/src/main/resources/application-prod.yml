# Profil "local" : connexion au Supabase CLI lancé avec `supabase start` à la racine du projet.
# Activer avec SPRING_PROFILES_ACTIVE=local (ou -Dspring.profiles.active=local).
# Port de la base décalé à 54332 (au lieu du 54322 par défaut) : un autre projet Supabase local
# tournait déjà sur les ports par défaut sur cette machine (voir supabase/config.toml).

spring:
  datasource:
    url: jdbc:postgresql://${PROD_DB_HOST}:${PROD_DB_PORT}/${PROD_DB_NAME}
    username: ${PROD_DB_USER}
    password: ${PROD_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${PROD_MAIL_HOST}
    port: ${PROD_MAIL_PORT}
    username: ${PROD_MAIL_USERNAME}
    password: ${PROD_MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  devtools:
    restart:
      enabled: false

server:
  port: ${PROD_SERVER_PORT}

app:
  jwt:
    secret: ${PROD_JWT_SECRET}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}
  frontend-url: ${FRONTEND_URL}


